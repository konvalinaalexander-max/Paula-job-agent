[project]
name = "paula-job-agent"
version = "0.2.0"
description = "Bereitet Bewerbungen vor - Paula sendet selbst. Siehe docs/."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  # Gmail, nur lesend
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  # Stellenquellen
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  # Lebenslaeufe lesen
  "pypdf>=4.2",
  "python-docx>=1.1",
  # Firmennamen vergleichen
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
