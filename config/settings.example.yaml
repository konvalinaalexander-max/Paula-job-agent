# Kopieren nach config/settings.yaml. Keine Geheimnisse hier - die liegen in der Umgebung.
# Das Suchprofil steht NICHT hier, sondern in der Datenbank unter profile/search
# (es wird in Phase 0 aus Paulas bisherigen Bewerbungen erarbeitet).

land: AT
sprache: de-AT          # oesterreichisches Deutsch: Jaenner, Bewerbungsunterlagen, "ss" wird verwendet
zeitzone: Europe/Vienna

mailbox:
  monate_zurueck: 36
  suchbegriffe: >
    bewerbung OR bewerbungsunterlagen OR "ihre bewerbung" OR absage OR
    "vorstellungsgespräch" OR "bewerbungsgespräch" OR einladung OR lebenslauf OR
    motivationsschreiben OR application OR "your application" OR interview OR
    stelle OR position
  max_zeichen_pro_mail: 8000

schwellwerte:
  stelle: 55            # bewusst niedrig - Paula ist offen und braucht dringend etwas
  initiativ: 70
  urteil_unsicher: 0.7  # darunter wird nachgefragt statt angenommen

grenzen:
  karten_pro_tag: 6             # wie viele neue Vorschlaege Paula hoechstens sieht
  initiativ_pro_woche: 5
  firmen_recherche_pro_nacht: 10
  sperrfrist_tage: 180          # dieselbe Firma fruehestens danach wieder
  sperrfrist_gilt_nicht_fuer_vermittler: true
  keine_antwort_nach_tagen: 42  # dann Nachfass-Vorschlag
  automatisch_schliessen_nach_tagen: 90
  aenderungsrunden: 3

quellen:
  adzuna:
    aktiv: true
    land: at
    max_tage_alt: 2
    treffer_pro_seite: 50
    max_seiten: 2
  mailalert:
    aktiv: true
    absender:
      - { name: karriere.at,  match: "@karriere.at" }
      - { name: willhaben,    match: "@willhaben.at" }
      - { name: stepstone,    match: "@stepstone.at" }
      - { name: ams,          match: "@ams.at" }
  karriereseiten:
    aktiv: false        # ab M7
  eingereicht:
    aktiv: true

texte:
  laenge_stelle: [150, 260]     # Woerter
  laenge_initiativ: [120, 200]
  verbotene_floskeln:
    - leidenschaftlich
    - hochmotiviert
    - "perfekt geeignet"
    - "Ihr renommiertes Unternehmen"
    - "ich bin überzeugt, dass"
  max_aehnlichkeit_zu_frueheren: 0.7
